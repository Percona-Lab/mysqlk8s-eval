apiVersion: v1
kind: Secret
metadata:
  name: mariadb-root
stringData:
  password: 1641fd15ea6f1323f22ab575
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
stringData:
  access-key-id: admin
  secret-access-key: REDACTED
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password
  storage:
    size: 40Gi
    storageClassName: linode-block-storage
    resizeInUseVolumes: true
  replicas: 3
  galera:
    enabled: true
  metrics:
    enabled: false
  tls:
    enabled: true
  resources:
    requests:
      cpu: 600m
      memory: 1Gi
    limits:
      memory: 3Gi
  myCnf: '[mariadb]

    innodb_buffer_pool_size=1073741824

    max_connections=500

    '
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: maxscale-galera
spec:
  replicas: 3
  mariaDbRef:
    name: mariadb-galera
  services:
  - name: rw-router
    router: readwritesplit
    listener:
      port: 3306
  monitor:
    interval: 2s
    cooperativeMonitoring: majority_of_all
  admin:
    port: 8989
    guiEnabled: true
  auth:
    generate: true
