apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3vol4
  namespace: s3
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 150Gi
  storageClassName: linode-block-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3vol4
  namespace: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3vol4
  template:
    metadata:
      labels:
        app: s3vol4
    spec:
      containers:
      - args:
        - volume
        - -dir=/data
        - -max=140
        - -mserver=s3-master.s3.svc:9333
        - -port=8083
        - -ip.bind=0.0.0.0
        - -ip=$(POD_IP)
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: docker.io/chrislusf/seaweedfs:latest
        name: vol
        volumeMounts:
        - mountPath: /data
          name: d
      nodeSelector:
        kubernetes.io/hostname: mk-cp
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: d
        persistentVolumeClaim:
          claimName: s3vol4

