apiVersion: v1
kind: Secret
metadata:
  name: mypwds
stringData:
  rootUser: root
  rootHost: '%'
  rootPassword: REDACTED
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-config
stringData:
  credentials: '[default]

    aws_access_key_id = admin

    aws_secret_access_key = REDACTED

    '
  config: '[default]

    region = us-east-1

    '
---
apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: mycluster
spec:
  secretName: mypwds
  tlsUseSelfSigned: true
  instances: 3
  router:
    instances: 3
  datadirVolumeClaimTemplate:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 40Gi
    storageClassName: linode-block-storage
  backupProfiles:
  - name: s3dump
    dumpInstance:
      storage:
        s3:
          bucketName: oracle
          prefix: /p3dumps
          config: s3-config
          profile: default
          endpoint: http://s3.s3.svc:9000
