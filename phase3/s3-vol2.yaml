apiVersion: v1
kind: Service
metadata: {name: s3-master, namespace: s3}
spec:
  selector: {app: s3}
  ports:
  - {name: http, port: 9333}
  - {name: grpc, port: 19333}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: s3vol2, namespace: s3}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linode-block-storage
  resources: {requests: {storage: 150Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3vol2, namespace: s3}
spec:
  replicas: 1
  selector: {matchLabels: {app: s3vol2}}
  template:
    metadata: {labels: {app: s3vol2}}
    spec:
      nodeSelector: {kubernetes.io/hostname: mk-cp}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
      - name: vol
        image: docker.io/chrislusf/seaweedfs:latest
        args: ["volume","-dir=/data","-max=140","-mserver=s3-master.s3.svc:9333","-port=8081","-ip.bind=0.0.0.0","-ip=$(POD_IP)"]
        env: [{name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}]
        volumeMounts: [{name: d, mountPath: /data}]
      volumes: [{name: d, persistentVolumeClaim: {claimName: s3vol2}}]
