apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: ps-rep
  finalizers:
  - percona.com/delete-mysql-pods-in-order
spec:
  crVersion: 1.2.0
  secretsName: ps-dr-secrets
  sslSecretName: ps-dr-ssl
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    versionServiceEndpoint: https://check.percona.com
  mysql:
    clusterType: group-replication
    autoRecovery: true
    size: 1
    image: percona/percona-server:8.4.10-10.1
    imagePullPolicy: Always
    gracePeriod: 600
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests:
        memory: 768Mi
      limits:
        memory: 2Gi
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    exposePrimary:
      enabled: true
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 5Gi
    env:
    - name: MALLOC_ARENA_MAX
      value: '2'
    configuration: '[mysqld]

      innodb_buffer_pool_size=268435456

      loose-group_replication_message_cache_size=134217728

      '
    bootstrap:
      mode: manual
  proxy:
    haproxy:
      enabled: true
      size: 1
      image: percona/haproxy:2.8.18-1
      imagePullPolicy: Always
      gracePeriod: 30
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
    router:
      enabled: false
      size: 3
      image: percona/percona-mysql-router:8.4.10
      imagePullPolicy: Always
      gracePeriod: 30
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          memory: 256M
        requests:
          memory: 256M
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
  orchestrator:
    enabled: false
    size: 3
    image: percona/percona-orchestrator:3.2.6-22
    imagePullPolicy: Always
    gracePeriod: 30
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      limits:
        memory: 256M
      requests:
        memory: 128M
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
  pmm:
    enabled: false
    image: percona/pmm-client:3.8.1
    imagePullPolicy: Always
    serverHost: monitoring-service
    resources:
      requests:
        cpu: 300m
        memory: 150M
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3
    readinessProbe:
      failureThreshold: 3
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3
  backup:
    enabled: false
    pitr:
      enabled: false
    image: percona/percona-xtrabackup:8.4.0-6.1
    imagePullPolicy: Always
    storages:
      s3-us-west:
        s3:
          bucket: S3-BACKUP-BUCKET-NAME-HERE
          credentialsSecret: ps-cluster1-s3-credentials
          region: us-west-2
        type: s3
        verifyTLS: true
  toolkit:
    image: percona/percona-toolkit:3.7.1-4
    imagePullPolicy: Always
  unsafeFlags:
    mysqlSize: true
    proxySize: true
