apiVersion: v1
kind: Secret
metadata: {name: app-users}
stringData: {probe: ProbePass123, sb: SbPass123}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata: {name: probe}
spec: {mariaDbRef: {name: mariadb-galera}}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata: {name: sbtest}
spec: {mariaDbRef: {name: mariadb-galera}}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata: {name: probe}
spec: {mariaDbRef: {name: mariadb-galera}, passwordSecretKeyRef: {name: app-users, key: probe}, host: "%"}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata: {name: sb}
spec: {mariaDbRef: {name: mariadb-galera}, passwordSecretKeyRef: {name: app-users, key: sb}, host: "%"}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata: {name: probe}
spec: {mariaDbRef: {name: mariadb-galera}, privileges: [ALL PRIVILEGES], database: probe, table: "*", username: probe, host: "%"}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata: {name: sb}
spec: {mariaDbRef: {name: mariadb-galera}, privileges: [ALL PRIVILEGES], database: sbtest, table: "*", username: sb, host: "%"}
