apiVersion: v1
kind: Namespace
metadata: {name: s3}
---
apiVersion: v1
kind: Secret
metadata: {name: s3cfg, namespace: s3}
stringData:
  s3.json: '{"identities":[{"name":"admin","credentials":[{"accessKey":"admin","secretKey":"CHANGE_ME_S3_SECRET"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: s3}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      nodeSelector: {kubernetes.io/hostname: mk-cp}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
      - name: s3
        image: docker.io/chrislusf/seaweedfs:latest
        args: [server, -dir=/data, -s3, -s3.port=9000, -s3.config=/cfg/s3.json, -volume.max=0, -master.volumeSizeLimitMB=1024]
        ports: [{containerPort: 9000}]
        readinessProbe: {tcpSocket: {port: 9000}, periodSeconds: 5}
        volumeMounts: [{name: d, mountPath: /data}, {name: c, mountPath: /cfg}]
      volumes:
      - {name: d, hostPath: {path: /srv/s3, type: DirectoryOrCreate}}
      - {name: c, secret: {secretName: s3cfg}}
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: s3}
spec: {selector: {app: s3}, ports: [{name: s3, port: 9000}]}
